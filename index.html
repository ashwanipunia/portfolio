<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Antigravity</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Google Sans', 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;
            color: #1f1f1f;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        #bgCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .main-container {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }

        /* Logo Component */
        .logo-wrapper {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 40px;
            user-select: none;
        }

        .logo-icon {
            width: 24px;
            height: 24px;
            display: inline-block;
        }

        .logo-text {
            font-size: 1.45rem;
            letter-spacing: -0.3px;
            color: #1f1f1f;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .logo-brand {
            font-weight: 500;
        }

        .logo-sub {
            font-weight: 400;
            color: #1f1f1f;
        }

        /* Headline */
        .headline {
            font-size: clamp(2.5rem, 5.5vw, 4.2rem);
            font-weight: 500;
            letter-spacing: -1.5px;
            line-height: 1.12;
            color: #1f1f1f;
            max-width: 900px;
            margin-bottom: 48px;
        }

        /* CTA Buttons */
        .cta-group {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            height: 52px;
            padding: 0 28px;
            border-radius: 26px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            text-decoration: none;
            border: none;
            outline: none;
        }

        .btn-primary {
            background-color: #111111;
            color: #ffffff;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }

        .btn-primary:hover {
            background-color: #2a2a2a;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0,0,0,0.12);
        }

        .btn-secondary {
            background-color: #f1f3f4;
            color: #1f1f1f;
            border: 1px solid #e0e0e0;
        }

        .btn-secondary:hover {
            background-color: #e8eaed;
            transform: translateY(-2px);
            border-color: #d0d0d0;
        }

        .btn-icon {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        @media (max-width: 768px) {
            .headline {
                font-size: 2.2rem;
                letter-spacing: -0.8px;
            }
            .btn {
                width: 100%;
                max-width: 320px;
            }
        }
    </style>
</head>
<body>

    <!-- Background Canvas -->
    <canvas id="bgCanvas"></canvas>

    <!-- Foreground Content -->
    <main class="main-container">
        <!-- Logo -->
        <div class="logo-wrapper">
            <svg class="logo-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Multicolored Chevron Icon -->
                <path d="M12 4L4 12H9L12 9L15 12H20L12 4Z" fill="#4285F4"/>
                <path d="M12 4L9 12H15L12 4Z" fill="#FBBC05"/>
                <path d="M15 12L12 9L9 12H4L12 20L20 12H15Z" fill="#34A853"/>
                <path d="M12 15L15 12H20L12 20Z" fill="#EA4335"/>
            </svg>
            <div class="logo-text">
                <span class="logo-brand">Google</span>
                <span class="logo-sub">Antigravity</span>
            </div>
        </div>

        <!-- Headline -->
        <h1 class="headline">
            Experience liftoff with the next-gen<br>agent platform
        </h1>

        <!-- CTA Buttons -->
        <div class="cta-group">
            <button class="btn btn-primary">
                <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                    <line x1="8" y1="21" x2="16" y2="21"></line>
                    <line x1="12" y1="17" x2="12" y2="21"></line>
                </svg>
                <span>Download for Windows</span>
            </button>

            <button class="btn btn-secondary">
                <span>Explore use cases</span>
            </button>
        </div>
    </main>

    <!-- Canvas Animation Script -->
    <script>
        (function() {
            const canvas = document.getElementById('bgCanvas');
            const ctx = canvas.getContext('2d');

            let width = 0;
            let height = 0;
            let dpr = 1;

            let mouse = { x: -1000, y: -1000, targetX: -1000, targetY: -1000 };

            // Particle arrays
            let microDots = [];
            let accentParticles = [];

            // Color palette gradient for top-right cluster
            const colors = [
                '#4285F4', // Cyan / Google Blue
                '#1A73E8', // Deep Blue
                '#5C6BC0', // Indigo
                '#8E24AA', // Purple
                '#D81B60', // Magenta
                '#EA4335'  // Red / Coral
            ];

            function resize() {
                dpr = window.devicePixelRatio || 1;
                width = window.innerWidth;
                height = window.innerHeight;

                canvas.width = width * dpr;
                canvas.height = height * dpr;
                ctx.scale(dpr, dpr);

                initParticles();
            }

            function initParticles() {
                // 1. Global Micro-Dots (Background texture)
                microDots = [];
                const dotCount = Math.floor((width * height) / 3200);
                for (let i = 0; i < dotCount; i++) {
                    microDots.push({
                        x: Math.random() * width,
                        y: Math.random() * height,
                        radius: Math.random() * 0.8 + 0.4,
                        opacity: Math.random() * 0.12 + 0.04
                    });
                }

                // 2. Top-Right Accent Particle Field
                accentParticles = [];
                const accentCount = Math.floor((width * height) / 2200);

                for (let i = 0; i < accentCount; i++) {
                    // Radius distribution centered around top-right quadrant
                    const u1 = Math.random();
                    const u2 = Math.random();

                    // Concentrated toward top-right corner (width, 0)
                    const baseX = width - Math.pow(u1, 1.4) * (width * 0.65);
                    const baseY = Math.pow(u2, 1.5) * (height * 0.85);

                    // Map position to color spectrum (Cyan top-left of cluster to Coral bottom-right)
                    const colorProgress = Math.min(Math.max(((baseX / width) * 0.4 + (baseY / height) * 0.6), 0), 0.99);
                    const colorIndex = Math.floor(colorProgress * (colors.length - 1));
                    const color = colors[colorIndex] || colors[0];

                    const type = Math.random() < 0.65 ? 'dash' : (Math.random() < 0.5 ? 'pill' : 'dot');

                    accentParticles.push({
                        baseX: baseX,
                        baseY: baseY,
                        x: baseX,
                        y: baseY,
                        vx: 0,
                        vy: 0,
                        length: Math.random() * 10 + 5,
                        width: Math.random() * 1.5 + 1.2,
                        angle: -Math.PI / 3 + (Math.random() - 0.5) * 0.3, // ~ -60 deg slant
                        phase: Math.random() * Math.PI * 2,
                        speed: Math.random() * 0.015 + 0.005,
                        ampX: Math.random() * 12 + 4,
                        ampY: Math.random() * 12 + 4,
                        color: color,
                        opacity: Math.random() * 0.75 + 0.25,
                        type: type
                    });
                }
            }

            function animate(time) {
                ctx.clearRect(0, 0, width, height);

                // Smooth mouse interpolation
                mouse.x += (mouse.targetX - mouse.x) * 0.1;
                mouse.y += (mouse.targetY - mouse.y) * 0.1;

                // Render Background Micro-Dots
                ctx.fillStyle = '#111111';
                for (let i = 0; i < microDots.length; i++) {
                    const d = microDots[i];
                    ctx.globalAlpha = d.opacity;
                    ctx.beginPath();
                    ctx.arc(d.x, d.y, d.radius, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Render Top-Right Accent Field
                const t = time * 0.001;

                for (let i = 0; i < accentParticles.length; i++) {
                    const p = accentParticles[i];

                    // Ambient zero-g turbulence drift
                    const floatX = p.baseX + Math.sin(t * p.speed * 60 + p.phase) * p.ampX;
                    const floatY = p.baseY + Math.cos(t * p.speed * 50 + p.phase) * p.ampY;

                    // Mouse Repulsion Physics
                    const dx = floatX - mouse.x;
                    const dy = floatY - mouse.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const maxDist = 130;

                    let pushX = 0;
                    let pushY = 0;

                    if (dist < maxDist) {
                        const force = (1 - dist / maxDist) * 35;
                        const angle = Math.atan2(dy, dx);
                        pushX = Math.cos(angle) * force;
                        pushY = Math.sin(angle) * force;
                    }

                    // Target position with spring physics
                    const targetX = floatX + pushX;
                    const targetY = floatY + pushY;

                    p.vx += (targetX - p.x) * 0.08;
                    p.vy += (targetY - p.y) * 0.08;
                    p.vx *= 0.82;
                    p.vy *= 0.82;

                    p.x += p.vx;
                    p.y += p.vy;

                    // Draw Particle
                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.angle + Math.sin(t + p.phase) * 0.08);
                    ctx.fillStyle = p.color;
                    ctx.strokeStyle = p.color;
                    ctx.globalAlpha = p.opacity;

                    if (p.type === 'dash') {
                        ctx.lineWidth = p.width;
                        ctx.lineCap = 'round';
                        ctx.beginPath();
                        ctx.moveTo(-p.length / 2, 0);
                        ctx.lineTo(p.length / 2, 0);
                        ctx.stroke();
                    } else if (p.type === 'pill') {
                        ctx.beginPath();
                        ctx.roundRect(-p.length / 2, -p.width / 2, p.length, p.width * 1.8, 3);
                        ctx.fill();
                    } else {
                        ctx.beginPath();
                        ctx.arc(0, 0, p.width * 1.2, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    ctx.restore();
                }

                requestAnimationFrame(animate);
            }

            // Mouse position listener
            window.addEventListener('mousemove', (e) => {
                mouse.targetX = e.clientX;
                mouse.targetY = e.clientY;
            });

            window.addEventListener('mouseleave', () => {
                mouse.targetX = -1000;
                mouse.targetY = -1000;
            });

            window.addEventListener('resize', resize);

            // Initialize
            resize();
            requestAnimationFrame(animate);
        })();
    </script>
</body>
</html>
